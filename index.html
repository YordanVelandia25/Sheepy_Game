<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sheepy Jump</title>
  <meta name="description" content="Ayuda a la oveja a saltar de tablón en tablón y subir lo más alto posible.">
  <meta name="theme-color" content="#47a6e0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800;900&family=Jost:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--GAME-START-->
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill">
      <div id="meters">0 m</div>
      <div id="bestHud"></div>
    </div>
    <div class="right">
      <div id="hearts" class="pill" aria-label="Vidas"></div>
      <button id="sound" type="button" aria-label="Silenciar sonido">🔊</button>
    </div>
  </div>

  <div id="overlay">
    <div class="card">
      <h1 id="title">Sheepy Jump</h1>
      <p id="message">¡Salta de tablón en tablón y sube lo más alto que puedas!</p>
      <div id="intro">
        <p class="how">La oveja salta sola. Toca el lado izquierdo o derecho de la pantalla, o usa las flechas ← →, para moverla.</p>
        <div class="legend">
          <span><i style="background:#c07a3e"></i>Tablón</span>
          <span><i style="background:#3f8fd0"></i>Se mueve</span>
          <span><i style="background:#dcc08e"></i>Se rompe</span>
        </div>
        <p class="how">Cuidado con las abejas y los cardos: cada choque quita un corazón.</p>
      </div>
      <p id="best"></p>
      <div class="field">
        <label for="player">Nombre del jugador</label>
        <input id="player" type="text" maxlength="16" autocomplete="nickname" enterkeyhint="go" placeholder="Escribe tu nombre" spellcheck="false">
        <p id="saved" class="hint"></p>
      </div>
      <button id="save" type="button" hidden>Guardar puntuación</button>
      <button id="play" type="button">Jugar</button>
      <section class="ranking" aria-labelledby="rankingTitle">
        <div class="ranking-head">
          <h2 id="rankingTitle">Ranking</h2>
          <div class="tabs" role="tablist" aria-label="Tipo de ranking">
            <button id="tabWorld" type="button" role="tab" aria-selected="true" hidden>Mundial</button>
            <button id="tabLocal" type="button" role="tab" aria-selected="false" hidden>Este dispositivo</button>
          </div>
        </div>
        <ol id="ranking"></ol>
      </section>
<!--GAME-END-->
      <button id="install" type="button" hidden>Instalar aplicación</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
    let deferredPrompt;
    const installBtn = document.getElementById('install');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });
    window.addEventListener('appinstalled', () => { installBtn.hidden = true; });
  </script>
</body>
</html>
